<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="layout">
        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>
            <h2>Overview</h2>
            <div class="boxes">
                <section class="box">
                    <h3>Total Projects</h3>
                    <p>24</p>
                </section>

                <section class="box">
                    <h3>Completed Tasks</h3>
                    <p>86</p>
                </section>

                <section class="box">
                    <h3>Pending Tasks</h3>
                    <p>12</p>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
