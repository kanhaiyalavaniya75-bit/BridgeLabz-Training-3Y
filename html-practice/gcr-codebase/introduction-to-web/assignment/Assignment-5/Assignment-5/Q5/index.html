<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pricing">
        <h1>Choose Your Plan</h1>

        <div class="plans">
            <section class="plan">
                <h2>Basic</h2>
                <div class="price">₹199 / month</div>
                <ul>
                    <li>5 Projects</li>
                    <li>Basic Support</li>
                    <li>5 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </section>

            <section class="plan popular">
                <h2>Standard</h2>
                <div class="price">₹499 / month</div>
                <ul>
                    <li>15 Projects</li>
                    <li>Priority Support</li>
                    <li>25 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </section>

            <section class="plan">
                <h2>Premium</h2>
                <div class="price">₹899 / month</div>
                <ul>
                    <li>Unlimited Projects</li>
                    <li>Premium Support</li>
                    <li>100 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </section>
        </div>
    </main>
</body>
</html>
