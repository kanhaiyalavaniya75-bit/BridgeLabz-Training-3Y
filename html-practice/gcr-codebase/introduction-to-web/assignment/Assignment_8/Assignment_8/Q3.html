<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Q3.css">
</head>
<body>
    <header><h1>Image Showcase</h1></header>
    <main class="gallery">
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape"></div><figcaption>Mountain View</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape"></div><figcaption>Forest Path</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait"></div><figcaption>Friendly Companion</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1035/600/400" alt="River landscape"></div><figcaption>Calm River</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1043/600/400" alt="Ocean landscape"></div><figcaption>Ocean View</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/id/1069/600/400" alt="Bridge landscape"></div><figcaption>Historic Bridge</figcaption></figure>
    </main>
    <footer>Responsive CSS Grid Image Gallery</footer>
</body>
</html>
