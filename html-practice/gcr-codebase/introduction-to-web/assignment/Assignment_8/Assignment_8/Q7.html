<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="Q7.css">
</head>
<body>
    <header><h1>Simple UI Components</h1></header>
    <main class="ui-card">
        <label for="search">Search</label>
        <div class="search-row">
            <input id="search" type="search" placeholder="Search here...">
            <button>Search</button>
        </div>
        <label for="category">Choose a category</label>
        <select id="category">
            <option>Select category</option>
            <option>Technology</option>
            <option>Education</option>
            <option>Design</option>
        </select>
        <div class="actions">
            <button>Save</button>
            <button class="secondary">Cancel</button>
        </div>
    </main>
    <footer>Clean and responsive user interface.</footer>
</body>
</html>
