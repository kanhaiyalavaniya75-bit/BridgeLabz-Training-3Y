<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="Q2.css">
</head>
<body>
    <header><h1>CSS Tooltip Demonstration</h1></header>
    <main class="tooltip-area">
        <section class="tooltip-box">
            <span class="icon">★<span class="tooltip">Favorite item</span></span>
            <p>Star</p>
        </section>
        <section class="tooltip-box">
            <span class="icon">?<span class="tooltip">Get help here</span></span>
            <p>Help</p>
        </section>
        <section class="tooltip-box">
            <span class="icon">!<span class="tooltip">Important information</span></span>
            <p>Alert</p>
        </section>
    </main>
    <footer>Hover over each symbol to see its tooltip.</footer>
</body>
</html>
