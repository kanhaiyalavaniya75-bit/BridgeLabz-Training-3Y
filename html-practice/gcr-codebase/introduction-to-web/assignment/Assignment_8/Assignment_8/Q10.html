<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="Q10.css">
</head>
<body>
    <header>
        <h1>Mini User Interface</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <div class="content">
                <h2>Create Your Profile</h2>
                <p>Fill in the form to create a simple profile.</p>
                <form>
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter your name">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Enter your email">
                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset" class="cancel">Reset</button>
                    </div>
                </form>
            </div>
            <img src="https://picsum.photos/id/64/350/300" alt="Profile workspace">
        </section>
    </main>
    <footer>© 2026 Mini User Interface</footer>
</body>
</html>
