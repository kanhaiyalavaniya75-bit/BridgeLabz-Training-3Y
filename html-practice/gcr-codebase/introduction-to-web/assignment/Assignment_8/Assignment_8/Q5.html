<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="Q5.css">
</head>
<body>
    <header><h1>Styled Button Collection</h1></header>
    <main class="buttons">
        <button class="primary">Primary</button>
        <button class="secondary">Secondary</button>
        <button class="outline">Outline</button>
        <button class="disabled" disabled>Disabled</button>
        <button class="focus-demo">Focus Me</button>
    </main>
    <section class="info">
        <p>Hover and press the buttons to see transitions. Use Tab to see the focus effect.</p>
    </section>
    <footer>Assignment 8 - Question 5</footer>
</body>
