<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the character encoding used by the webpage. -->
    <meta charset="UTF-8">

    <!-- Provides a short description of the webpage. -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- Identifies the author of the webpage. -->
    <meta name="author" content="Kanhiya Lavaniya">

    <!-- Sets the title shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- Sets a base URL for relative links. -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon or stylesheet. -->
    <link rel="icon" href="https://www.google.com/favicon.ico">

    <!-- The style tag can contain CSS rules for the page. -->
    <style>
    </style>

    <!-- The script tag is used for JavaScript. It is empty here as required. -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates the important elements that can be placed inside the HTML head.</p>
</body>
</html>
