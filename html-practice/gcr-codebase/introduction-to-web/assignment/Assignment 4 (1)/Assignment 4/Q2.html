<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>My City Map</h1>
    <!-- loading="lazy" delays loading the map until it is near the visible area. -->
    <iframe
        src="https://www.google.com/maps?q=Agra%2C%20India&output=embed"
        title="Google Map of Agra"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
