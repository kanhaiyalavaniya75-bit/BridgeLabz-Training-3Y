<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>
    <h1>ABC Senior Secondary School</h1>

    <table border="1" title="Student Marks Report">
        <tr>
            <th colspan="4">Student Report Card</th>
        </tr>
        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>English</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>100</td>
            <td>85</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Computer</td>
            <td>100</td>
            <td>95</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Hindi</td>
            <td>100</td>
            <td>78</td>
            <td>B+</td>
        </tr>
        <tr title="Total marks and percentage">
            <th colspan="2">Total</th>
            <td colspan="2">430 / 500</td>
        </tr>
        <tr>
            <th colspan="2">Percentage</th>
            <td colspan="2">86%</td>
        </tr>
    </table>
</body>
</html>
