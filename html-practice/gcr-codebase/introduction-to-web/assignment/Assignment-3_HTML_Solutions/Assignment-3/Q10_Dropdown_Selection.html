<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>India Gate</option>
    </select>

    <p>
        My choices are: Country - India, State - Uttar Pradesh,
        City - Mathura, Favorite Tourist Place - Taj Mahal.
    </p>
</body>
</html>
