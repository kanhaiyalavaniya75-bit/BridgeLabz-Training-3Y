<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

            <th>Image</th>
            <th>Product Name</th>

            <th>Price</th>

            <td><img src="https://via.placeholder.com/100" alt="Laptop"></td>
            <td>Laptop</td>

        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Headphones"></td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,000</td>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Smartphone"></td>
            <td>Smartphone</td>
            <td>Modern smartphone with a high-quality camera.</td>
            <td>₹25,000</td>
            <td>Out of Stock</td>
        </tr>

</html>
