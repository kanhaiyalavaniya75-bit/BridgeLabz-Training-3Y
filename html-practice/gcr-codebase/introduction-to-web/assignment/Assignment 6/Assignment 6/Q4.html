<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="Q4.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </aside>

        <main>
            <section class="box"><h2>Sales</h2><p>₹85,000</p></section>
            <section class="box"><h2>Users</h2><p>1,250</p></section>
            <section class="box wide"><h2>Performance</h2><p>Overall performance is improving steadily.</p></section>
            <section class="box"><h2>Tasks</h2><p>42 completed</p></section>
            <section class="box"><h2>Messages</h2><p>18 new messages</p></section>
        </main>
    </div>
</body>
</html>
