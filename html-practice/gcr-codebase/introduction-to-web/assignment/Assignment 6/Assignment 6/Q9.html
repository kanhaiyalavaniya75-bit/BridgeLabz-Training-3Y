<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="Q9.css">
</head>
<body>
    <main class="scene">
        <div class="card">
            <div class="card-face front">
                <img src="https://picsum.photos/id/1005/400/300" alt="Profile">
                <h2>Web Developer</h2>
            </div>

            <div class="card-face back">
                <h2>About Me</h2>
                <p>I enjoy building responsive webpages and learning modern web development techniques.</p>
            </div>
        </div>
    </main>
</body>
</html>
